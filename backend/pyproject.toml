[project]
name = "genai-interview"
version = "0.1.0"
description = "FastAPI backend for AI-powered interview platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Core Framework
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    # Database
    "sqlalchemy",
    "psycopg2-binary",
    "asyncpg",
    "greenlet",
    # Authentication & Security
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-dotenv",
    "pydantic[email]",
    "pydantic-settings",
    # Background Tasks
    "celery",
    "redis",
    # AI & ML
    "openai",
    "anthropic",
    "langchain",
    "langchain-openai",
    "google-generativeai",
    "PyPDF2",
    "python-docx",
    # Cloud Storage
    "boto3",
    # HTTP Client
    "httpx",
    "aiofiles",
    # Email
    "sendgrid",
    # Utilities
    "python-dateutil",
    "pytz",
    "gtts>=2.5.4",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
    "faker",
]



[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "faker>=38.0.0",
    "httpx>=0.28.1",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]
